spring.application.name=ms-usuarios
server.port=8801

# ORACLE
spring.datasource.url=jdbc:oracle:thin:@msfestival_medium?TNS_ADMIN=${TNS_ADMIN_PATH:/app/wallet}
spring.datasource.username=ms_usuarios
spring.datasource.password=Festival12345
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# EUREKA DESACTIVADO
eureka.client.enabled=false

ms.eventos.url=${MS_EVENTOS_URL:http://localhost:8802}
ms.notificaciones.url=${MS_NOTIFICACIONES_URL:http://localhost:8806}

# SWAGGER
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# JWT
jwt.secret=festival-secret-key-2024-muy-larga-para-cumplir-256bits
jwt.expiration=86400000

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL